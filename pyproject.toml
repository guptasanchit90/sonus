[project]
name = "sonus-tts"
version = "0.1.0"
description = "Sonus — Speak freely. Multi-engine offline TTS server for Apple Silicon"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = "venv"
include = ["server.py", "src"]
exclude = ["venv", "models", "outputs"]
typeCheckingMode = "basic"
