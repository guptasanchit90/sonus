<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonus — Speak freely</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app">

  <div class="app-header">
    <h1>Sonus</h1>
    <span class="subtitle">Multi-engine local audio hub (Speech, Music, SFX, STT)</span>
    <a href="/api-docs" target="_blank" style="margin-left:auto;font-size:0.8rem;color:var(--accent);text-decoration:none;white-space:nowrap">API Docs</a>
    <a href="/mcp-docs/mcp.md" target="_blank" style="margin-left:0.5rem;font-size:0.8rem;color:var(--accent);text-decoration:none;white-space:nowrap">MCP</a>
    <button class="btn btn-sm" style="margin-left:0.5rem" @click="$store.showManage = true">Manage Models</button>
    <button class="btn btn-sm btn-danger" style="margin-left:0.5rem" @click="$store.showResetConfirm = true">Reset</button>
  </div>

  <div class="panels">
    <div class="sidebar-panels">
      <voice-panel></voice-panel>
      <sfx-panel></sfx-panel>
      <preset-panel></preset-panel>
    </div>
    <generate-form></generate-form>
    <output-panel></output-panel>
  </div>

  <curl-console></curl-console>

  <teleport to="body">
    <transition name="modal">
      <add-voice-modal v-if="$store.showAddVoice"></add-voice-modal>
    </transition>
    <transition name="modal">
      <params-modal v-if="$store.showParams"></params-modal>
    </transition>
    <transition name="modal">
      <manage-models-modal v-if="$store.showManage"></manage-models-modal>
    </transition>
    <transition name="modal">
      <batch-detail-modal v-if="$store.showBatchDetail"></batch-detail-modal>
    </transition>
    <transition name="modal">
      <save-preset-modal v-if="$store.showSavePreset"></save-preset-modal>
    </transition>
    <transition name="modal">
      <confirm-reset-modal v-if="$store.showResetConfirm"></confirm-reset-modal>
    </transition>
    <transition name="modal">
      <save-output-modal v-if="$store.showSaveOutput"></save-output-modal>
    </transition>
  </teleport>

</div>

<!-- ── Component Templates ──────────────────────────────────────────────── -->

<script type="text/x-template" id="audio-player-template">
  <div class="item">
    <div class="player-main">
      <button class="player-play-btn" :class="{ playing: isCurrent }" @click="togglePlay" :title="playing ? 'Stop' : 'Play'">
        <span class="play-icon">&#9654;</span>
        <span class="stop-icon">&#9632;</span>
      </button>
      <div class="player-info">
        <div v-if="primaryLabel" class="player-title">{{ primaryLabel }}</div>
        <div v-else class="player-title">{{ item.name }}</div>
        <div v-if="primaryLabel" class="player-subtitle">{{ item.name }}</div>
        <div class="player-meta">{{ durStr }}{{ durStr && sizeStr ? ' \u00B7 ' : '' }}{{ sizeStr }}</div>
        <div class="player-date" v-if="dateStr">{{ dateStr }}</div>
      </div>
      <div class="player-actions">
        <a v-if="showDownload" class="player-dl" :href="item.url" download title="Download">&#x2193;</a>
        <button v-if="showRename" class="icon-btn" @click="$emit('rename', item.name)" title="Rename">&#9998;</button>
        <button v-if="showDetail" class="icon-btn" @click="$emit('detail', item)" title="Show details">&#9432;</button>
        <button v-if="showSave" class="icon-btn save-trigger" @click="$emit('save', item)" title="Save">Save</button>
        <button v-if="showDelete" class="icon-btn danger" @click="$emit('delete', item.name)" title="Delete">&times;</button>
      </div>
    </div>
    <div class="player-seeker" v-if="seeker" @click="seek">
      <div class="seeker-equ">
        <div v-if="playing" class="wave-bars"><span v-for="i in 20" :key="i"></span></div>
        <div class="seeker-track">
          <div class="seeker-fill" :class="{ playing: playing }" :style="{ width: duration ? (currentTime / duration * 100) + '%' : '0%' }"></div>
        </div>
      </div>
      <span class="seeker-time">{{ formatTime(currentTime) }} / {{ formatTime(duration) }}</span>
    </div>
  </div>
</script>

<script type="text/x-template" id="voice-panel-template">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-group">
        <span>Custom Voices</span>
        <span class="panel-info-icon" v-if="items && items.length > 0" :title="`Total: ${items.length} files (${totalSizeStr})`">&#9432;</span>
      </div>
      <button class="btn btn-sm" @click="$store.showAddVoice = true">+ Add</button>
    </div>
    <div class="panel-body">
      <div v-if="!items.length" class="empty">No voice files yet.<br>Click "+ Add" to upload or record one.</div>
      <div v-for="v in items" :key="v.name">
        <template v-if="renaming && renaming.original === v.name">
          <div class="item">
            <div class="player-main">
              <input class="name-edit" v-model="renaming.current" @keydown.enter="submitRename" @keydown.escape="cancelRename" @blur="submitRename">
            </div>
          </div>
        </template>
        <audio-player v-else :item="v" show-rename show-delete @rename="startRename" @delete="deleteVoice"></audio-player>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="sfx-panel-template">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-group">
        <span>Sound Effects</span>
        <span class="panel-info-icon" v-if="items && items.length > 0" :title="`Total: ${items.length} files (${totalSizeStr})`">&#9432;</span>
      </div>
      <button class="btn btn-sm" @click="triggerUpload">+ Add</button>
      <input type="file" ref="sfxUploadInput" style="display:none" accept="audio/*" @change="uploadSFXFile">
    </div>
    <div class="panel-body">
      <div v-if="uploading" class="empty">Uploading...</div>
      <div v-if="!items.length && !uploading" class="empty">No SFX files yet.<br>Click "+ Add" to upload one.</div>
      <div v-for="s in items" :key="s.name">
        <template v-if="renaming && renaming.original === s.name">
          <div class="item">
            <div class="player-main">
              <input class="sfx-name-edit" v-model="renaming.current" @keydown.enter="submitRename" @keydown.escape="cancelRename" @blur="submitRename">
            </div>
          </div>
        </template>
        <audio-player v-else :item="s" show-rename show-delete @rename="startRename" @delete="deleteSFX"></audio-player>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="preset-panel-template">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-group">
        <span>Presets</span>
        <span class="panel-info-icon" v-if="items && items.length > 0" :title="`Total: ${items.length} presets (${totalSizeStr})`">&#9432;</span>
      </div>
    </div>
    <div class="panel-body">
      <div v-if="!items.length" class="empty">No presets saved yet.</div>
      <div v-for="p in items" :key="p.name" class="item" :title="p.preview">
        <template v-if="renaming && renaming.original === p.name">
          <div class="player-main">
            <input class="preset-name-edit" v-model="renaming.current" @keydown.enter="submitRename" @keydown.escape="cancelRename" @blur="submitRename" @click.stop>
          </div>
        </template>
        <template v-else>
          <div class="player-main">
            <div class="player-info preset-clickable" @click="applyPreset(p)">
              <div class="player-title">{{ p.name }}</div>
              <div class="player-meta">{{ p.preview }}</div>
            </div>
            <div class="player-actions">
              <button class="icon-btn" @click="startRename(p.name)" title="Rename">&#9998;</button>
              <button class="icon-btn danger" @click="deletePreset(p.name)" title="Delete">&times;</button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="output-panel-template">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title-group">
        <span>Outputs</span>
        <span class="panel-info-icon" v-if="$store.outputs && $store.outputs.length > 0" :title="`Total: ${$store.outputs.length} files (${totalSizeStr})`">&#9432;</span>
      </div>
      <button class="btn btn-sm btn-ghost" @click="clearOutputs" title="Delete all">Clear</button>
    </div>
    <div class="panel-filters" v-if="hasOutputs">
      <div class="filter-row">
        <select v-model="$store.filterState.engine">
          <option value="">Engine</option>
          <option v-for="e in engineOptions" :value="e">{{ e }}</option>
        </select>
        <select v-model="$store.filterState.model">
          <option value="">Model</option>
          <option v-for="m in modelOptions" :value="m">{{ m }}</option>
        </select>
      </div>
      <div class="filter-row">
        <select v-model="$store.filterState.time">
          <option value="">All time</option>
          <option value="5">Last 5 min</option>
          <option value="15">Last 15 min</option>
          <option value="30">Last 30 min</option>
          <option value="60">Last 1 hr</option>
          <option value="360">Last 6 hr</option>
          <option value="720">Last 12 hr</option>
          <option value="1440">Last 1 day</option>
          <option value="4320">Last 3 days</option>
          <option value="10080">Last 7 days</option>
        </select>
        <button class="btn btn-sm btn-ghost" style="font-size:0.65rem;padding:0.2rem 0.4rem" @click="clearFilters">Clear</button>
      </div>
    </div>
    <div class="panel-body">
      <div v-if="$store.outputsLoading" class="outputs-loading">
        <div class="soundwave-loader">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="outputs-loading-text">Loading outputs…</div>
      </div>
      <div v-else-if="!filtered.length" class="empty">No outputs match the current filters.</div>
      <div v-for="item in displayItems" :key="item._type === 'batch_summary' ? item.batchId : item.name">
        <template v-if="item._type === 'batch_summary'">
          <div class="batch-summary-card" @click="openBatchDetail(item)">
            <div class="batch-summary-main">
              <span class="batch-summary-arrow">&#9654;</span>
              <div class="batch-summary-info">
                <div class="batch-summary-title">{{ item.label }}</div>
                <div class="batch-summary-meta">{{ item.items.length }} file{{ item.items.length > 1 ? 's' : '' }} &#183; {{ batchTotalStr(item) }}</div>
              </div>
            </div>
          </div>
        </template>
        <audio-player v-else :item="item" show-save show-detail show-delete @detail="showDetail" @delete="deleteOutput" @save="openSaveModal"></audio-player>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="save-output-modal-template">
  <div class="modal-overlay" @click.self="close">
    <div class="modal save-output-modal">
      <div class="modal-header">
        <h2>Save Output</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="save-output-name">Name</label>
          <input type="text" id="save-output-name" v-model="saveName"
                 placeholder="Enter a name for the saved file"
                 @keydown.enter="saveAsSfx" ref="nameInput">
        </div>
        <div class="save-output-info">
          <div class="save-output-info-row"><span class="save-output-label">File:</span> {{ item.name }}</div>
          <div class="save-output-info-row" v-if="item.params && item.params.model"><span class="save-output-label">Model:</span> {{ item.params.model }}</div>
        </div>
        <div class="status-msg" :class="statusClass" v-if="status">{{ status }}</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="close">Cancel</button>
        <button type="button" class="btn" @click="saveAsSfx" :disabled="saving">Save as SFX</button>
        <button type="button" class="btn" @click="saveAsVoice" :disabled="saving || !canSaveAsVoice">Save as Custom Voice</button>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="generate-form-template">
  <div class="panel">
    <div class="panel-header">
      <div class="app-tabs">
        <button class="app-tab" :class="{ active: $store.activeTab === 'generate' }" @click="$store.activeTab = 'generate'" type="button">Generate Speech</button>
        <button class="app-tab" :class="{ active: $store.activeTab === 'music' }" @click="switchToMusicTab" type="button">Music / SFX</button>
        <button class="app-tab" :class="{ active: $store.activeTab === 'transcribe' }" @click="switchToTranscribeTab" type="button">Transcribe</button>
      </div>
    </div>
    <div class="panel-body">

      <template v-if="$store.activeTab === 'generate'">
      <div class="mode-toggle">
        <div class="pill-indicator" :class="{ right: $store.batchMode }"></div>
        <button class="mode-btn" :class="{ active: !$store.batchMode }" @click="$store.batchMode = false" :disabled="!!$store.batchProgress">Single</button>
        <button class="mode-btn" :class="{ active: $store.batchMode }" @click="$store.batchMode = true" :disabled="!!$store.batchProgress">Batch</button>
      </div>
      <form @submit.prevent="$store.batchMode ? batchSubmit() : onSubmit()">
        <div class="form-group">
          <label for="text">Text *</label>
          <div class="ssml-toolbar">
            <select class="ssml-select" :disabled="!$store.form.model" @change="onVoiceSelect($event)" title="Insert Voice">
              <option value="">+ Voice</option>
              <option v-for="v in allModelVoices" :value="v">{{ v }}</option>
            </select>
            <select class="ssml-select" @change="onBreakSelect($event)" title="Insert Pause">
              <option value="">+ Pause</option>
              <option value="200ms">200ms</option>
              <option value="500ms">500ms</option>
              <option value="1s">1.0s</option>
              <option value="2s">2.0s</option>
              <option value="custom">Custom...</option>
            </select>
            <select class="ssml-select" @change="onProsodySelect($event)" title="Insert Speed">
              <option value="">+ Speed</option>
              <option value="0.8">0.8x</option>
              <option value="1.0">1.0x</option>
              <option value="1.2">1.2x</option>
              <option value="1.5">1.5x</option>
              <option value="2.0">2.0x</option>
            </select>
            <select class="ssml-select" @change="onAudioSelect($event)" title="Insert SFX (Audio)">
              <option value="">+ SFX</option>
              <optgroup label="Sound Effects" v-if="allSFXFiles.length">
                <option v-for="v in allSFXFiles" :value="v">{{ v }}</option>
              </optgroup>
              <option value="custom">Custom URL...</option>
            </select>
            <button type="button" class="ssml-btn" @click="insertSayAsTag">Spell Out</button>
            <button type="button" class="ssml-btn" @click="insertSubTag">Sub</button>
            <button type="button" class="ssml-btn template-btn" @click="loadSSMLTemplate">Load Template</button>
          </div>
          <textarea id="text" v-model="$store.form.text" placeholder="Enter text to synthesize..." required></textarea>
          <div class="ssml-validation-error" v-if="ssmlValidationError">{{ ssmlValidationError }}</div>
          <div style="margin-top:0.25rem;display:flex;gap:0.4rem">
            <button
              v-if="$store.form.auto_ssml && $store.form.text.length >= 300 && !$store.form.text.trim().startsWith('<speak')"
              type="button"
              class="btn btn-sm"
              @click="convertToSSML"
            >To SSML</button>
            <button
              v-if="$store.form.text.trim().startsWith('<speak')"
              type="button"
              class="btn btn-sm"
              @click="stripSSML"
            >To Plain</button>
          </div>
        </div>

        <template v-if="!$store.batchMode">
          <div class="form-group">
            <label for="model">Model *</label>
            <select id="model" v-model="$store.form.model" @change="onModelChange" required>
              <option value="">— Select a model —</option>
              <optgroup v-for="engine in sortedEngines" :label="engineLabel(engine)">
                <option v-for="m in groupedModels[engine]" :value="m.id" :disabled="!m.available">
                  {{ m.name }}{{ capsLabel(m) }}{{ unavailLabel(m) }}
                </option>
              </optgroup>
            </select>
            <div class="voice-hint" v-if="modelDesc">{{ modelDesc }}</div>
            <div class="voice-hint" v-if="modelLangs.length">Languages: {{ modelLangs.join(', ') }}</div>
          </div>

          <div v-if="capabilities.includes('speaker') && !capabilities.includes('voice_blend')" class="form-group voice-field">
            <label for="speaker_name">Speaker Name</label>
            <select id="speaker_name" v-model="$store.form.speaker_name">
              <option value="">— Select a voice —</option>
              <option v-for="v in modelVoices.built_in" :value="v">{{ v }}</option>
            </select>
          </div>

          <div v-if="capabilities.includes('voice_blend')" class="form-group voice-field">
            <label>Voice</label>
            <div class="mode-toggle blend-toggle">
              <div class="pill-indicator" :class="{ right: $store.blendMode }"></div>
              <button class="mode-btn" :class="{ active: !$store.blendMode }" @click="$store.blendMode = false" type="button">Single</button>
              <button class="mode-btn" :class="{ active: $store.blendMode }" @click="$store.blendMode = true" type="button">Blend</button>
            </div>
            <select v-if="!$store.blendMode" v-model="$store.form.speaker_name">
              <option value="">— Select a voice —</option>
              <option v-for="v in modelVoices.built_in" :value="v">{{ v }}</option>
            </select>
            <template v-else>
              <div class="voice-blend-summary" v-if="blendVoicesCount">
                <code>{{ blendVoiceString }}</code>
              </div>
              <div class="model-grid blend-grid">
                <div v-for="(v, i) in modelVoices.built_in" :key="v" class="model-card" :style="{ '--i': i }"
                  :class="{ selected: isBlendSelected(v) }" @click="toggleBlendVoice(v)">
                  <input type="checkbox" :checked="isBlendSelected(v)" @click.stop>
                  <span class="model-name">{{ v }}</span>
                  <input v-if="isBlendSelected(v)" type="number" class="blend-weight-input" min="0" max="1" step="0.01"
                    :value="getBlendWeight(v)" @input.stop="setBlendWeight(v, parseFloat($event.target.value))" @click.stop>
                </div>
              </div>
              <div class="model-select-actions" v-if="modelVoices.built_in.length">
                <button type="button" @click="selectAllBlendVoices">Select all</button>
                <button type="button" @click="$store.blendSelections = {}">Clear</button>
              </div>
              <div class="voice-hint" v-if="!blendVoicesCount">Select at least one voice to blend. Equal weights when omitted.</div>
            </template>
          </div>

          <div v-if="capabilities.includes('voice_prompt')" class="form-group voice-field">
            <label for="voice_description">Voice Description</label>
            <textarea id="voice_description" v-model="$store.form.voice_description" placeholder="Describe the voice..." rows="2"></textarea>
          </div>

          <div v-if="capabilities.includes('voice_clone')" class="form-group voice-field">
            <label for="sample_voice_file">Sample Voice File</label>
            <select id="sample_voice_file" v-model="$store.form.sample_voice_file">
              <option value="">— Select a voice file —</option>
              <option v-for="v in modelVoices.cloneable" :value="v">{{ v }}</option>
            </select>
          </div>
        </template>

        <template v-if="$store.batchMode">
          <div class="tab-bar">
            <button v-for="tab in batchTabs" :key="tab.key"
              class="tab-btn" :class="{ active: $store.batchTab === tab.key }"
              @click="switchBatchTab(tab.key)" type="button">
              {{ tab.label }}
            </button>
          </div>

          <!-- Voice Clone tab -->
          <template v-if="$store.batchTab === 'clone'">
            <div class="form-group">
              <label>Models ({{ cloneBatchLabel }})</label>
              <div class="model-grid">
                <div v-for="(m, i) in cloneModels" :key="m.id" class="model-card" :style="{ '--i': i }" :class="{ selected: $store.selectedBatchModels.includes(m.id) }" @click="toggleBatchModel(m.id)">
                  <input type="checkbox" :checked="$store.selectedBatchModels.includes(m.id)" @click.stop>
                  <span class="model-name">{{ m.name }}</span>
                </div>
              </div>
              <div class="model-select-actions">
                <button type="button" @click="selectAllVisible">Select all</button>
                <button type="button" @click="clearSelected">Clear</button>
              </div>
            </div>
            <div class="form-group voice-field">
              <label for="b_clone_voice">Sample Voice File</label>
              <select id="b_clone_voice" v-model="$store.form.sample_voice_file">
                <option value="">— Select a voice file —</option>
                <option v-for="v in allCloneableVoices" :value="v">{{ v }}</option>
              </select>
            </div>
          </template>

          <!-- Voice Prompt tab -->
          <template v-if="$store.batchTab === 'prompt'">
            <div class="form-group">
              <label>Models ({{ promptBatchLabel }})</label>
              <div class="model-grid">
                <div v-for="(m, i) in promptModels" :key="m.id" class="model-card" :style="{ '--i': i }" :class="{ selected: $store.selectedBatchModels.includes(m.id) }" @click="toggleBatchModel(m.id)">
                  <input type="checkbox" :checked="$store.selectedBatchModels.includes(m.id)" @click.stop>
                  <span class="model-name">{{ m.name }}</span>
                </div>
              </div>
              <div class="model-select-actions">
                <button type="button" @click="selectAllVisible">Select all</button>
                <button type="button" @click="clearSelected">Clear</button>
              </div>
            </div>
            <div class="form-group voice-field">
              <label for="b_prompt_voice">Voice Description</label>
              <textarea id="b_prompt_voice" v-model="$store.form.voice_description" placeholder="Describe the voice..." rows="2"></textarea>
            </div>
          </template>

          <!-- Multi-Voice tab -->
          <template v-if="$store.batchTab === 'multivoice'">
            <div class="form-group">
              <label for="b_mv_model">Model</label>
              <select id="b_mv_model" v-model="$store.multivoiceModel">
                <option value="">— Select a model —</option>
                <optgroup v-for="eng in speakerEngineNames" :key="eng" :label="engineLabel(eng)">
                  <option v-for="m in speakerModelsByEngine[eng]" :key="m.id" :value="m.id">{{ m.name }}</option>
                </optgroup>
              </select>
            </div>
            <div class="form-group" v-if="multivoiceVoices.length">
              <label>Voices ({{ multivoiceSelectedCount }} selected)</label>
              <div class="model-grid">
                <div v-for="(v, i) in multivoiceVoices" :key="v" class="model-card" :style="{ '--i': i }"
                  :class="{ selected: $store.multivoiceSelectedVoices.includes(v) }"
                  @click="toggleMultivoiceVoice(v)">
                  <input type="checkbox" :checked="$store.multivoiceSelectedVoices.includes(v)" @click.stop>
                  <span class="model-name">{{ v }}</span>
                </div>
              </div>
              <div class="model-select-actions">
                <button type="button" @click="selectAllVoices">Select all</button>
                <button type="button" @click="$store.multivoiceSelectedVoices = []">Clear</button>
              </div>
            </div>
            <div class="voice-hint" v-if="!$store.multivoiceModel">
              Select a speaker model to choose voices.
            </div>
            <div class="voice-hint" v-else-if="!multivoiceVoices.length">
              No built-in voices for this model.
            </div>
          </template>

          <div class="form-group">
            <label for="batch_gap">Delay between generations (ms)</label>
            <input type="number" id="batch_gap" v-model.number="$store.batchGapMs" min="500" max="10000" step="100">
          </div>
        </template>

        <div class="advanced-section">
          <button class="advanced-toggle" :class="{ open: $store.showAdvanced }" @click="$store.showAdvanced = !$store.showAdvanced" type="button">
            <span class="advanced-arrow">&#9654;</span>
            <span>Advanced</span>
            <span class="advanced-summary" v-if="!$store.showAdvanced">{{ advancedSummary }}</span>
          </button>
          <div class="advanced-body" :class="{ open: $store.showAdvanced }">
            <div class="range-row" style="margin-bottom:0.75rem">
              <div class="form-group">
                <label for="adv_speed">Speed</label>
                <input type="range" id="adv_speed" min="0.25" max="4.0" step="0.25" v-model.number="$store.form.speed">
                <div class="range-label"><span>0.25x</span><span>{{ Number($store.form.speed).toFixed(2) }}x</span><span>4.0x</span></div>
              </div>
            </div>
            <div class="range-row">
              <div class="form-group" v-if="capabilities.includes('temperature')">
                <label for="adv_temperature">Temperature</label>
                <input type="range" id="adv_temperature" min="0" max="2" step="0.1" v-model.number="$store.form.temperature">
                <div class="range-label"><span>0</span><span>{{ Number($store.form.temperature).toFixed(1) }}</span><span>2</span></div>
              </div>
              <div class="form-group">
                <label for="adv_seed">Seed (blank = random)</label>
                <input type="number" id="adv_seed" placeholder="Random" min="0" v-model.number="$store.form.seed">
              </div>
            </div>
            <div class="range-row" v-if="capabilities.includes('emotion')">
              <div class="form-group">
                <label for="adv_exaggeration">Exaggeration (emotion)</label>
                <input type="range" id="adv_exaggeration" min="0" max="1" step="0.05" v-model.number="$store.form.exaggeration">
                <div class="range-label"><span>0</span><span>{{ Number($store.form.exaggeration).toFixed(2) }}</span><span>1</span></div>
              </div>
              <div class="form-group">
                <label for="adv_cfg_weight">CFG Weight</label>
                <input type="range" id="adv_cfg_weight" min="0" max="1" step="0.05" v-model.number="$store.form.cfg_weight">
                <div class="range-label"><span>0</span><span>{{ Number($store.form.cfg_weight).toFixed(2) }}</span><span>1</span></div>
                <div class="voice-hint">&gt; 0.5 may truncate</div>
              </div>
            </div>
            <div class="checkbox-group" style="margin-top:0.25rem">
              <input type="checkbox" id="adv_auto_ssml" v-model="$store.form.auto_ssml">
              <label for="adv_auto_ssml">Auto-SSML (chunk long text)</label>
            </div>
            <div class="e2e-section">
              <div class="checkbox-group">
                <input type="checkbox" id="e2e_enabled" v-model="$store.e2eEnabled" :disabled="!hasAvailSttModel">
                <label for="e2e_enabled">Validate with STT (transcribe &amp; compare)</label>
              </div>
              <template v-if="$store.e2eEnabled">
                <div class="form-group">
                  <label for="e2e_model">STT Model</label>
                  <select id="e2e_model" v-model="$store.e2eModel">
                    <optgroup label="MLX Whisper (Apple Silicon)">
                      <option v-for="m in $store.e2eModels.filter(x => x.mlx_required)" :key="m.id" :value="m.id" :disabled="!m.available">
                        {{ m.name }}{{ m.available ? '' : ' [install]' }}
                      </option>
                    </optgroup>
                    <optgroup label="Faster Whisper (CPU / GPU)">
                      <option v-for="m in $store.e2eModels.filter(x => !x.mlx_required)" :key="m.id" :value="m.id" :disabled="!m.available">
                        {{ m.name }}{{ m.available ? '' : ' [install]' }}
                      </option>
                    </optgroup>
                  </select>
                </div>
                <div class="form-group">
                  <label for="e2e_language">Language (optional)</label>
                  <input type="text" id="e2e_language" v-model="$store.e2eLanguage" placeholder="e.g. en">
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="generate-row">
          <button type="button" class="btn btn-ghost btn-sm save-preset-btn" @click="$store.showSavePreset = true" :disabled="$store.loading" title="Save current config as a preset">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save as Preset
          </button>
          <button type="submit" class="btn" :class="[{ loading: $store.loading }, btnState]" :disabled="$store.loading || batchSubmitDisabled || ssmlValidationError">
            <span class="spinner"></span>
            {{ batchSubmitLabel }}
          </button>
        </div>

        <div class="batch-progress" v-if="$store.batchProgress">
          <div class="progress-bar">
            <div class="progress-fill" :style="{ width: ($store.batchProgress.current / $store.batchProgress.total * 100) + '%' }"></div>
          </div>
          <div class="progress-label">
            <span>{{ $store.batchProgress.current }} / {{ $store.batchProgress.total }} — {{ $store.batchProgress.modelName }}</span>
            <button type="button" class="btn btn-sm btn-ghost" @click="cancelBatch" style="font-size:0.6rem;padding:0.1rem 0.4rem">Cancel</button>
          </div>
        </div>

        <transition name="slide">
          <div v-if="$store.batchSummary" class="batch-summary" :class="$store.batchSummary.type">
            {{ $store.batchSummary.message }}
            <div class="batch-summary-detail" v-if="$store.batchSummary.detail">{{ $store.batchSummary.detail }}</div>
          </div>
        </transition>

        <transition name="slide">
          <div class="status-msg" :class="genStatusClass" v-if="genStatus && !$store.batchProgress">{{ genStatus }}</div>
        </transition>
      </form>
      </template>

      <template v-if="$store.activeTab === 'music'">
      <form @submit.prevent="onMusicSubmit()">
        <div class="form-group">
          <label for="music-text">Prompt *</label>
          <textarea id="music-text" v-model="$store.musicForm.text" placeholder="Describe the music or sound effect to generate... e.g. lo-fi hip hop beat with vinyl crackle" required></textarea>
        </div>

        <div class="form-group">
          <label for="music-model">Model *</label>
          <select id="music-model" v-model="$store.musicForm.model" required>
            <option value="">— Select a model —</option>
            <option v-for="m in musicModels" :value="m.id" :disabled="!m.available">
              {{ m.name }}{{ capsLabel(m) }}{{ unavailLabel(m) }}
            </option>
          </select>
          <div class="voice-hint" v-if="musicModelDesc">{{ musicModelDesc }}</div>
        </div>

        <div class="form-group">
          <label for="music-duration">Duration (seconds)</label>
          <input type="range" id="music-duration" min="1.0" max="30.0" step="1.0" v-model.number="$store.musicForm.duration">
          <div class="range-label">
            <span>1s</span>
            <span>{{ Number($store.musicForm.duration).toFixed(1) }}s</span>
            <span>30s</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn" :class="btnState" :disabled="$store.loading">
            <span class="loading-dots" v-if="$store.loading"><span></span><span></span><span></span></span>
            <span v-else>Generate</span>
          </button>
          <button type="button" class="btn btn-ghost" :disabled="!curlReady || $store.loading" @click="$store.curlOpen = !$store.curlOpen">curl</button>
        </div>

        <transition name="slide">
          <div class="status-msg" :class="genStatusClass" v-if="genStatus">{{ genStatus }}</div>
        </transition>
      </form>
      </template>

      <template v-if="$store.activeTab === 'transcribe'">
      <div class="mode-toggle">
        <div class="pill-indicator" :class="{ right: $store.batchTranscribeMode }"></div>
        <button class="mode-btn" :class="{ active: !$store.batchTranscribeMode }" @click="$store.batchTranscribeMode = false" :disabled="!!$store.batchTranscribeProgress">Single</button>
        <button class="mode-btn" :class="{ active: $store.batchTranscribeMode }" @click="switchTranscribeMode(true)" :disabled="!!$store.batchTranscribeProgress">Batch</button>
      </div>

      <input type="file" ref="transcribeFileAddInput" id="transcribeFileAddInput" multiple accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm" @change="transcribeUploadSubmit" hidden>

      <template v-if="!$store.transcribeForm.stagedFiles.length">
        <div class="transcribe-source-tabs">
          <button class="modal-tab transcribe-source-tab" :class="{ active: $store.transcribeForm.audioSource === 'file' }" @click="$store.transcribeForm.audioSource = 'file'" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload File
          </button>
          <button class="modal-tab transcribe-source-tab" :class="{ active: $store.transcribeForm.audioSource === 'record' }" @click="$store.transcribeForm.audioSource = 'record'" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            Record Audio
          </button>
          <button class="modal-tab transcribe-source-tab" :class="{ active: $store.transcribeForm.audioSource === 'url' }" @click="$store.transcribeForm.audioSource = 'url'" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            From URL
          </button>
        </div>

        <div v-if="$store.transcribeForm.audioSource === 'file'" class="transcribe-upload-zone">
          <input type="file" ref="transcribeFileInput" multiple accept="audio/*,.wav,.mp3,.m4a,.ogg,.webm" @change="transcribeUploadSubmit" hidden>
          <div class="upload-zone" @click="$refs.transcribeFileInput.click()">
            <svg class="upload-zone-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span class="upload-zone-label">Click to select audio file(s)</span>
            <span class="upload-hint">Multiple files accepted &mdash; WAV, MP3, M4A, OGG, WebM</span>
          </div>
          <div class="transcribe-status" v-if="transcribeStagingStatus">
            <div class="status-msg" :class="transcribeStagingStatusClass">{{ transcribeStagingStatus }}</div>
          </div>
        </div>

        <div v-if="$store.transcribeForm.audioSource === 'record'" class="record-section">
          <div class="record-btn-wrap">
            <button type="button" class="record-btn" :class="{ recording: $store.transcribeRecording }" @click="$store.transcribeRecording ? stopTranscribeRecording() : startTranscribeRecording()">
              <template v-if="!$store.transcribeRecording">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
              </template>
              <template v-else>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
              </template>
            </button>
            <span class="record-label">{{ $store.transcribeRecording ? 'Recording...' : 'Click to record' }}</span>
          </div>
          <div class="wave-container" v-show="$store.transcribeRecording">
            <canvas id="transcribe-wave" ref="transcribeWaveCanvas" width="380" height="60"></canvas>
          </div>
        </div>

        <div v-if="$store.transcribeForm.audioSource === 'url'" class="url-section">
          <div class="url-input-wrap url-input-inline">
            <svg class="url-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <input type="url" ref="transcribeUrlInput" v-model="$store.transcribeForm.urlAddress" placeholder="https://example.com/audio.mp3" @keyup.enter="transcribeUrlSubmit">
            <button type="button" class="btn" @click="transcribeUrlSubmit" :disabled="transcribeUrlFetching" style="flex-shrink:0;white-space:nowrap">{{ transcribeUrlFetching ? 'Fetching...' : 'Fetch' }}</button>
          </div>
          <div class="transcribe-status" v-if="transcribeStagingStatus">
            <div class="status-msg" :class="transcribeStagingStatusClass">{{ transcribeStagingStatus }}</div>
          </div>
        </div>
      </template>

      <template v-if="$store.transcribeForm.stagedFiles.length">
        <div class="staged-file-tabs" v-if="$store.transcribeForm.stagedFiles.length > 1">
          <button v-for="(f, i) in $store.transcribeForm.stagedFiles" :key="f.name"
            class="staged-file-tab" :class="{ active: $store.transcribeForm.activeFileIndex === i }"
            @click="switchActiveFile(i)" type="button">
            <span class="staged-file-tab-name">{{ f.name.replace('.wav', '').slice(0, 18) }}</span>
            <span class="staged-file-tab-remove" @click.stop="removeStagedFile(i)">&times;</span>
          </button>
        </div>
        <div class="staged-card transcribe-staged">
          <div class="staged-header">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span>{{ activeStagedFile.name.replace('.wav', '') }}</span>
          </div>
          <div class="staged-meta">
            <span class="staged-meta-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              {{ activeStagedFile.duration }}s
            </span>
            <span class="staged-meta-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              {{ (activeStagedFile.size / 1024).toFixed(0) }} KB
            </span>
            <span class="staged-meta-badge staged-meta-badge-accent">WAV</span>
          </div>
          <div class="staged-player">
            <div class="staged-player-main">
              <button class="player-play-btn" :class="{ playing: transcribePlaying }" @click="toggleTranscribePlayer" :title="transcribePlaying ? 'Stop' : 'Play'">
                <span class="play-icon">&#9654;</span>
                <span class="stop-icon">&#9632;</span>
              </button>
              <div class="staged-player-info">
                <div class="staged-player-name">{{ activeStagedFile.name.replace('.wav', '') }}</div>
                <div class="staged-player-meta">{{ activeStagedFile.duration }}s</div>
              </div>
            </div>
            <div class="player-seeker" v-if="transcribeSeeker" @click="seekTranscribePlayer">
              <div class="seeker-equ">
                <div v-if="transcribePlaying" class="wave-bars"><span v-for="i in 20" :key="i"></span></div>
                <div class="seeker-track">
                  <div class="seeker-fill" :class="{ playing: transcribePlaying }" :style="{ width: transcribeDuration ? (transcribeCurrentTime / transcribeDuration * 100) + '%' : '0%' }"></div>
                </div>
              </div>
              <span class="seeker-time">{{ formatTranscribeTime(transcribeCurrentTime) }} / {{ formatTranscribeTime(transcribeDuration) }}</span>
            </div>
          </div>
          <div class="staged-actions">
            <button type="button" class="btn btn-ghost" @click="removeStagedFile($store.transcribeForm.activeFileIndex)">Remove</button>
            <button type="button" class="btn btn-ghost" @click="addMoreFiles">Add more</button>
          </div>
        </div>
      </template>

      <div class="form-group" v-if="availSttModels.length && !$store.batchTranscribeMode">
        <label for="transcribe_model">Model *</label>
        <select id="transcribe_model" v-model="$store.transcribeForm.model" :disabled="!!$store.batchTranscribeProgress">
          <option value="">— Select a model —</option>
          <optgroup label="MLX Whisper (Apple Silicon)">
            <option v-for="m in sttMlxModels" :key="m.id" :value="m.id" :disabled="!m.available">
              {{ m.name }}{{ m.available ? '' : ' [install]' }}
            </option>
          </optgroup>
          <optgroup label="Faster Whisper (CPU / GPU)">
            <option v-for="m in sttFasterModels" :key="m.id" :value="m.id" :disabled="!m.available">
              {{ m.name }}{{ m.available ? '' : ' [install]' }}
            </option>
          </optgroup>
        </select>
      </div>

      <template v-if="$store.batchTranscribeMode">
        <div class="form-group">
          <label>Models for batch ({{ selectedTranscribeCount }} selected)</label>
          <div class="model-grid">
            <div v-for="(m, i) in availSttModels" :key="m.id" class="model-card" :style="{ '--i': i }"
              :class="{ selected: $store.selectedTranscribeModels.includes(m.id) }"
              @click="toggleTranscribeBatchModel(m.id)">
              <input type="checkbox" :checked="$store.selectedTranscribeModels.includes(m.id)" @click.stop>
              <span class="model-name">{{ m.name }}</span>
            </div>
          </div>
          <div class="model-select-actions">
            <button type="button" @click="selectAllTranscribeModels">Select all</button>
            <button type="button" @click="$store.selectedTranscribeModels = []">Clear</button>
          </div>
        </div>
      </template>

      <div class="transcribe-advanced">
        <div class="form-group">
          <label for="transcribe_language">Language (optional)</label>
          <input type="text" id="transcribe_language" v-model="$store.transcribeForm.language" placeholder="e.g. en, fr" :disabled="!!$store.batchTranscribeProgress">
        </div>
      </div>

      <div class="generate-row" style="margin-top:0.75rem">
        <button type="button" class="btn" :class="{ loading: $store.transcribeLoading }" :disabled="!canTranscribe || !!$store.batchTranscribeProgress" @click="$store.batchTranscribeMode ? submitBatchTranscribe() : submitTranscribe()">
          <span class="spinner"></span>
          {{ $store.batchTranscribeMode ? batchTranscribeLabel : 'Transcribe' }}
        </button>
      </div>

      <div class="batch-progress" v-if="$store.batchTranscribeProgress">
        <div class="progress-bar">
          <div class="progress-fill" :style="{ width: ($store.batchTranscribeProgress.current / $store.batchTranscribeProgress.total * 100) + '%' }"></div>
        </div>
        <div class="progress-label">
          <span>{{ $store.batchTranscribeProgress.current }} / {{ $store.batchTranscribeProgress.total }} &mdash; {{ $store.batchTranscribeProgress.modelName }}</span>
          <button type="button" class="btn btn-sm btn-ghost" @click="cancelBatchTranscribe" style="font-size:0.6rem;padding:0.1rem 0.4rem">Cancel</button>
        </div>
      </div>

      <transition name="slide">
        <div v-if="$store.batchTranscribeSummary" class="batch-summary" :class="$store.batchTranscribeSummary.type">
          {{ $store.batchTranscribeSummary.message }}
          <div class="batch-summary-detail" v-if="$store.batchTranscribeSummary.detail">{{ $store.batchTranscribeSummary.detail }}</div>
        </div>
      </transition>

      <transition name="slide">
        <div class="transcribe-status" v-if="$store.transcribeStatus && !$store.batchTranscribeProgress">
          <div class="status-msg" :class="$store.transcribeStatusClass">{{ $store.transcribeStatus }}</div>
        </div>
      </transition>

      <div v-if="$store.transcribeResults.length && !$store.batchTranscribeMode" class="transcribe-results-list">
        <div v-for="r in $store.transcribeResults" :key="r.fileName" class="transcribe-result">
          <div class="transcribe-result-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
            <span>{{ r.fileName }}</span>
            <div class="transcribe-result-meta">
              <span v-if="r.detected_language" class="transcribe-lang-badge">{{ r.detected_language }}</span>
            </div>
            <div class="transcribe-result-actions">
              <button class="icon-btn" @click="copyTranscription(r.text)" title="Copy transcription">&#x2398;</button>
              <button class="icon-btn" @click="downloadTranscriptionTxt(r.text, r.fileName)" title="Download as text">&#x2193;</button>
            </div>
          </div>
          <textarea class="transcribe-result-text" readonly>{{ r.text }}</textarea>
        </div>
      </div>

      <div v-if="batchGroupedResults.length && $store.batchTranscribeMode" class="transcribe-batch-results">
        <div v-for="(group, gi) in batchGroupedResults" :key="group.fileName" class="transcribe-batch-group">
          <div class="transcribe-batch-group-header" @click="toggleFileGroup(gi)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span class="transcribe-batch-group-name">{{ group.fileName }}</span>
            <span class="transcribe-batch-group-count">{{ group.results.length }} model{{ group.results.length > 1 ? 's' : '' }}</span>
            <span class="collapse-arrow" :class="{ open: expandedFileGroups[gi] }">&#9654;</span>
          </div>
          <div v-if="expandedFileGroups[gi]" class="transcribe-batch-group-body">
            <div v-for="r in group.results" :key="r.modelId" class="transcribe-batch-item">
              <div class="transcribe-result-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>{{ r.modelName }}</span>
                <span v-if="r.detected_language" class="transcribe-lang-badge">{{ r.detected_language }}</span>
                <div class="transcribe-result-actions">
                  <button class="icon-btn" @click="copyTranscription(r.text)" title="Copy">&#x2398;</button>
                  <button class="icon-btn" @click="downloadTranscriptionTxt(r.text, r.modelId)" title="Download">&#x2193;</button>
                </div>
              </div>
              <textarea class="transcribe-result-text" readonly>{{ r.text }}</textarea>
            </div>
          </div>
        </div>
      </div>
      </template>

    </div>
  </div>
</script>

                  </span>
                  <span class="mm-name">{{ item.name }}</span>
                  <span class="mm-size" v-if="item.size">{{ item.size }}</span>
                </div>
                <div class="mm-desc" v-if="item.description">{{ item.description }}</div>
                <div class="mm-url" v-if="item.install && item.install.url">
                  <a :href="item.install.url" target="_blank" rel="noopener">{{ item.install.source || 'Source' }}</a>
                </div>
                <div class="mm-id">ID: <code>{{ item.id }}</code> &middot; Model: <code>{{ item.model }}</code></div>

                <div class="mm-tags" v-if="item.capabilities && item.capabilities.length">
                  <span class="mm-tag" v-for="cap in item.capabilities" :key="cap">{{ cap }}</span>
                </div>

                <div class="mm-langs" v-if="item.languages && item.languages.length">
                  Languages: {{ item.languages.join(', ') }}
                </div>

                <div v-if="item.install && item.install.commands && item.install.commands.length" class="mm-cmds">
                  <div class="mm-cmds-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg>
                    Download
                  </div>
                  <div class="mm-cmd" v-for="cmd in item.install.commands" :key="cmd">
                    <code>{{ cmd }}</code>
                    <button class="mm-copy" @click="copyCmd(cmd)">Copy</button>
                  </div>
                </div>

                <div v-if="derivedRemove(item)" class="mm-cmds mm-cmds-remove">
                  <div class="mm-cmds-label">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Remove
                  </div>
                  <div class="mm-cmd" v-for="cmd in derivedRemove(item)" :key="cmd">
                    <code>{{ cmd }}</code>
                    <button class="mm-copy" @click="copyCmd(cmd)">Copy</button>
                  </div>
                </div>

                <div class="mm-actions">
                  <template v-if="item.install && item.install.commands && item.install.commands.length">
                    <button v-if="!item.available" class="btn btn-sm" @click="confirmDownload(item)">Download</button>
                    <button v-if="item.available" class="btn btn-sm btn-danger" @click="confirmRemove(item)">Remove</button>
                    <button class="btn btn-sm btn-ghost" @click="copyAll(item)">Copy All</button>
                  </template>
                  <span v-else class="mm-na">No install info</span>
                </div>
              </div>
            </div>
          </div>
        </template>

        <div v-if="status" class="status-msg" :class="statusClass">{{ status }}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" @click="close">Close</button>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="batch-detail-modal-template">
  <div class="modal-overlay" @click.self="close">
    <div class="modal batch-detail-modal">
      <div class="bd-header">
        <h2>{{ modalTitle }}</h2>
        <div class="bd-info">
          <div class="bd-info-row" v-if="sharedText">
            <span class="bd-label">Prompt:</span>
            <span class="bd-value">{{ sharedText }}</span>
          </div>
          <div class="bd-info-row" v-if="singularInfo">
            <span class="bd-label">{{ singularInfo.label }}:</span>
            <span class="bd-value">{{ singularInfo.value }}</span>
          </div>
          <div class="bd-info-row">
            <span class="bd-label">Generated:</span>
            <span class="bd-value">{{ totalGenerated }}</span>
          </div>
        </div>
      </div>

      <div class="batch-detail-body">
        <div v-for="item in $store.batchDetailItems" :key="item.name" class="bd-item">
          <audio-player :item="item" :primary-label="itemDiff(item)" show-download show-delete @delete="deleteItem"></audio-player>
          <div v-if="item.params && item.params.e2e" class="e2e-result" :class="e2eResultClass(item.params.e2e.similarity)">
            <span class="e2e-score">{{ (item.params.e2e.similarity * 100).toFixed(1) }}%</span>
            <span class="e2e-wer">WER {{ (item.params.e2e.wer * 100).toFixed(1) }}%</span>
            <span class="e2e-detail" :title="item.params.e2e.transcription">{{ item.params.e2e.transcription }}</span>
          </div>
        </div>
      </div>

      <div class="bd-footer">
        <button class="btn btn-ghost" @click="close">Close</button>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="save-preset-modal-template">
  <div class="modal-overlay" @click.self="close">
    <div class="modal save-preset-modal">
      <div class="modal-header">
        <h2>Save Preset</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="save-preset-name">Preset name</label>
          <input type="text" id="save-preset-name" v-model="presetName" placeholder="Leave blank for auto-generated name" @keydown.enter="save" ref="nameInput">
        </div>
        <div class="preset-save-preview">
          <div class="preset-save-preview-label">Will save:</div>
          <div class="preset-save-preview-text">{{ preview }}</div>
        </div>
        <div class="status-msg" :class="statusClass" v-if="status">{{ status }}</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" @click="close">Cancel</button>
        <button type="button" class="btn" @click="save" :disabled="saving">{{ saving ? 'Saving...' : 'Save Preset' }}</button>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="confirm-reset-modal-template">
  <div class="modal-overlay" @click.self="close">
    <div class="modal confirm-reset-modal">
      <div class="modal-header">
        <h2>Reset Sonus</h2>
      </div>
      <div class="modal-body">
        <p class="reset-warning">This will permanently delete:</p>
        <ul class="reset-list">
          <li><strong>Generated outputs:</strong> {{ counts.outputs }} file(s)</li>
          <li><strong>Custom voices:</strong> {{ counts.voices }} file(s)</li>
          <li><strong>Presets:</strong> {{ counts.presets }} preset(s)</li>
          <li><strong>Cached settings:</strong> UI preferences and form state</li>
        </ul>
        <div v-if="status" class="status-msg" :class="statusClass">{{ status }}</div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" @click="close" :disabled="resetting">Cancel</button>
        <button class="btn btn-danger" @click="reset" :disabled="resetting">{{ resetting ? 'Resetting...' : 'Reset Everything' }}</button>
      </div>
    </div>
  </div>


</script>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/js/store.js"></script>
<script src="/js/components.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
